theme = "onedark"

[editor]
line-number = "relative"
auto-completion = true
auto-format = true
auto-save = true
mouse = true

[editor.lsp]
enable = true
display-messages = true
auto-signature-help = true
display-inlay-hints = true
snippets = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true
